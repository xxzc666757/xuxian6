<script>
/* =====================================================================
 * 页面交互
 * ===================================================================== */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    mode: 'tencent',
    last: null,        // 最近一次解析结果
    raw: '',           // 最近一次原始输入
    count: 0           // 本地解析次数
  };

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg, bad) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'on' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 1800);
  }

  /* ---------------- 授权码 / 设备绑定 ---------------- */
  function initAuth() {
    var code = localStorage.getItem('tcx.auth.code');
    if (!code) {
      code = TXC.makeAuthCode();
      localStorage.setItem('tcx.auth.code', code);
    }
    var udid = localStorage.getItem('tcx.udid');
    if (!udid) {
      udid = TXC.deviceId();
      localStorage.setItem('tcx.udid', udid);
    }
    var n = Number(localStorage.getItem('tcx.convert.count') || '0') || 0;
    state.count = n;
    $('authCode').textContent = TXC.maskCode(code);
    $('authExpire').textContent = '永久';
  }

  /* ---------------- 模式切换 ---------------- */
  function setMode(mode) {
    state.mode = mode;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.classList.toggle('on', c.dataset.mode === mode);
    });
    $('keyRow').style.display = (mode === 'key') ? '' : 'none';
    var ph = {
      tencent: '把需要解析的原始数据粘贴到这里...',
      json: '粘贴 JSON 文本（支持带杂质的前后缀，自动截取 {...} / [...]）...',
      base64: '粘贴 Base64 字符串（自动识别 UTF-8 / 二进制）...',
      key: '粘贴 AES-GCM 密文（Base64）可解密；粘贴明文可加密...'
    }[mode];
    $('input').setAttribute('placeholder', ph);
  }

  $('chips').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    setMode(btn.dataset.mode);
  });

  /* ---------------- 渲染 ---------------- */
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  function renderFields(fields) {
    var box = $('fieldBox');
    if (!fields || !Object.keys(fields).length) {
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }
    var keys = Object.keys(fields);
    var html = '<div class="dim" style="font-size:11px;margin-bottom:6px;">字段明细 · ' + keys.length + ' 项</div>';
    keys.forEach(function (k) {
      var v = String(fields[k]);
      html += '<div class="frow">' +
        '<span class="fk">' + esc(k) + '</span>' +
        '<span class="fv" title="' + esc(v) + '">' + esc(v) + '</span>' +
        '<button class="copy-mini" data-copy="' + esc(v) + '">复制</button>' +
        '</div>';
    });
    box.innerHTML = html;
    box.style.display = '';
  }

  $('fieldBox').addEventListener('click', function (e) {
    var b = e.target.closest('.copy-mini');
    if (!b) return;
    copy(String(b.dataset.copy), '字段已复制');
  });

  function renderResult(out) {
    var box = $('result');
    var lines = [];

    if (out.mode === 'tencent') {
      lines.push('<span class="ok">✓ 腾讯 qzapp 授权码</span>' + (out.appid ? '  <span class="dim">appid=' + esc(out.appid) + '</span>' : ''));
      lines.push('');
      lines.push('<span class="k">pasteboard</span>  <span class="dim">' + esc(out.pasteboard) + '</span>');
      lines.push('');
      lines.push('<span class="k">enterCode</span>');
      lines.push(esc(out.enterCode));
      lines.push('');
      lines.push('<span class="k">原始链接</span>');
      lines.push(esc(out.url));
    } else if (out.mode === 'json') {
      lines.push('<span class="ok">✓ JSON 解析成功</span>  <span class="dim">' + out.summary + '</span>');
      lines.push('');
      lines.push(esc(out.json.pretty));
    } else if (out.mode === 'base64') {
      lines.push('<span class="ok">✓ Base64 解码</span>  <span class="dim">' + esc(out.summary) + '</span>');
      lines.push('');
      lines.push(esc(out.b64.decoded));
      lines.push('');
      lines.push('<span class="k">回编码校验</span>  <span class="dim">' + (out.b64.reencoded === out.raw.replace(/\s+/g, '') ? '一致' : '已规范化') + '</span>');
    } else if (out.mode === 'key') {
      if (out.direction === 'decrypt') {
        lines.push('<span class="ok">✓ AES-GCM 解密成功</span>');
        lines.push('');
        lines.push(esc(out.plain));
      } else {
        lines.push('<span class="ok">✓ AES-GCM 加密完成</span>  <span class="dim">（Base64 密文，可回填解密）</span>');
        lines.push('');
        lines.push(esc(out.cipher));
      }
    }

    if (out.trace && out.trace.length) {
      lines.push('');
      lines.push('<span class="dim">— 处理轨迹 —</span>');
      out.trace.forEach(function (t) {
        lines.push('<span class="dim">· ' + esc(t) + '</span>');
      });
    }

    box.innerHTML = lines.join('\n');
    $('meta').textContent = '解析完成 · ' + out.ms + 'ms · v20261112';
  }

  function renderError(msg) {
    $('result').innerHTML = '<span class="err">✗ ' + esc(msg) + '</span>\n\n<span class="dim">请检查输入格式，或切换上方模式后重试。</span>';
    $('meta').textContent = '解析失败 · v20261112';
    $('fieldBox').style.display = 'none';
  }

  /* ---------------- 开始解析 ---------------- */
  $('runBtn').addEventListener('click', async function () {
    var raw = $('input').value;
    if (!raw.trim()) {
      toast('请先粘贴原始数据', true);
      $('input').focus();
      return;
    }
    var btn = $('runBtn');
    btn.disabled = true;
    btn.textContent = '解析中...';
    try {
      var key = $('keyInput').value;
      var out = await TXC.convert(state.mode, raw, key);
      out.raw = raw;
      state.last = out;
      state.raw = raw;

      renderResult(out);
      renderFields(out.fields || null);

      state.count += 1;
      localStorage.setItem('tcx.convert.count', String(state.count));

      // 解密结果若是 JSON，顺手美化字段表
      if (out.mode === 'key' && out.direction === 'decrypt') {
        try {
          var o = JSON.parse(out.plain);
          if (o && typeof o === 'object') renderFields(o);
        } catch (e) { /* 非 JSON，忽略 */ }
      }
      toast('解析完成 · ' + out.ms + 'ms');
    } catch (err) {
      var body = raw.trim();
      /* 静态站没有后端：腾讯模式下遇到提货码形态的输入，走前端派生 */
      if (state.mode === 'tencent' && /^[0-9A-Za-z]{8,64}$/.test(body)) {
        try {
          var f = await TXC_DERIVE.derive(body);
          var txt = TXC_DERIVE.toQuery(f);
          $('result').innerHTML = '<span class="ok">✓ 解析成功</span>\n\n' + esc(txt);
          $('meta').textContent = '解析成功 · v20261112';
          renderFields(f);
          state.last = { fields: f, text: txt, mode: 'tencent' };
          toast('解析成功');
          return;
        } catch (e2) { /* 继续走原始错误 */ }
      }
      renderError(err && err.message ? err.message : String(err));
      toast(err && err.message ? err.message : '解析失败', true);
    } finally {
      btn.disabled = false;
      btn.textContent = '开始解析';
    }
  });

  /* ---------------- 清空 ---------------- */
  $('clearBtn').addEventListener('click', function () {
    $('input').value = '';
    $('keyInput').value = '';
    $('result').innerHTML = '<span class="ph">解析后的内容会显示在这里</span>';
    $('meta').textContent = '等待解析 · v20261112';
    $('fieldBox').style.display = 'none';
    $('fieldBox').innerHTML = '';
    state.last = null;
    toast('已清空');
  });

  /* ---------------- 复制 ---------------- */
  function copy(text, okMsg) {
    if (!text) { toast('没有可复制的内容', true); return; }
    var done = function () { toast(okMsg || '已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }
  function fallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('请手动复制', text); }
    document.body.removeChild(ta);
  }

  function resultText() {
    var el = $('result');
    if (!state.last) return '';
    var out = state.last;
    if (out.mode === 'tencent') {
      return ['enterCode: ' + out.enterCode, '', 'pasteboard: ' + out.pasteboard, '', 'url: ' + out.url].join('\n');
    }
    if (out.mode === 'json') return out.json.pretty;
    if (out.mode === 'base64') return out.b64.decoded;
    if (out.mode === 'key') return out.direction === 'decrypt' ? out.plain : out.cipher;
    return el.textContent;
  }

  $('copyResult').addEventListener('click', function () {
    copy(resultText(), '结果已复制');
  });

  $('copyRaw').addEventListener('click', function () {
    copy($('input').value, '原始数据已复制');
  });

  /* ---------------- OP/Auth ---------------- */
  $('opAuth').addEventListener('click', function () {
    var fields = state.last && state.last.fields;
    if (!fields) {
      toast('请先解析腾讯授权码', true);
      return;
    }
    var auth = TXC.buildOpAuth(fields);
    var out = ['# OP/Auth 三种常见形态', '', '[Query]', auth.query, '', '[Piped]', auth.piped, '', '[Basic]', auth.basic].join('\n');
    $('result').innerHTML = '<span class="ok">✓ OP/Auth 已生成</span>\n\n' + out.split('\n').map(esc).join('\n');
    $('meta').textContent = 'OP/Auth · v20261112';
    copy(auth.query, 'OP/Auth 已复制（Query 形态）');
  });

  /* ---------------- 做违规（风控自检） ---------------- */
  $('riskBtn').addEventListener('click', function () {
    var fields = state.last && state.last.fields;
    if (!fields) {
      toast('请先解析出字段', true);
      return;
    }
    var r = TXC.riskScan(fields);
    var lines = ['<span class="' + (r.pass ? 'ok' : 'err') + '">' + (r.pass ? '✓ 自检通过' : '✗ 存在 ' + r.bad + ' 项风险') + '</span>', ''];
    r.rows.forEach(function (row) {
      lines.push('<span class="' + (row.ok ? 'ok' : 'err') + '">' + (row.ok ? '✓' : '✗') + '</span> <span class="s">' + esc(row.msg) + '</span>');
    });
    lines.push('');
    lines.push('<span class="dim">— 违规定性规则 —</span>');
    lines.push('<span class="dim">· 凭证缺失：'+ (r.rows.filter(function(x){return !x.ok;}).map(function(x){return x.msg.split(" ")[0];}).join(', ') || '无') +'</span>');
    lines.push('<span class="dim">· 处置建议：' + (r.pass ? '正常放行' : '回退补号 / 重新取码') + '</span>');
    $('result').innerHTML = lines.join('\n');
    $('meta').textContent = '风控自检 · ' + (r.pass ? 'PASS' : 'FAIL') + ' · v20261112';
  });

  /* ---------------- 启动 ---------------- */
  initAuth();
  setMode('tencent');   /* 与原始界面一致：默认腾讯 */
})();
</script>
